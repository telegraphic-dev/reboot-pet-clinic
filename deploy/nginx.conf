worker_processes auto;
pid /var/run/nginx.pid;

events { worker_connections 1024; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen ${PORT};
    server_name _;
    root /app/web/dist;
    index index.html;

    location = /healthz {
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    location /__/reboot/ {
      proxy_pass http://127.0.0.1:9991;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      # TLS terminates at Coolify; preserve the external scheme for Reboot's
      # OAuth callback URL and secure session-cookie generation.
      proxy_set_header X-Forwarded-Proto https;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $http_connection;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    # Reboot owns the OAuth start/callback/session endpoints. Without this
    # proxy, the SPA fallback serves index.html for /__/oauth/* and repeatedly
    # redirects users back to the sign-in route.
    location /__/oauth/ {
      proxy_pass http://127.0.0.1:9991;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto https;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 300s;
    }

    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
